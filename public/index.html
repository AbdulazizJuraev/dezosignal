<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DezoSignal — kripto, forex, oltin va aksiyalar signallari</title>
<meta name="description" content="Texnik tahlil signallari: EMA trend, RSI, MACD, ATR stop va maqsad. Har bir aktiv uchun tarixiy natija. Moliyaviy maslahat emas.">
<meta name="theme-color" content="#0a0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><b>Dezo<span>Signal</span></b></div>
  <div class="tfs" id="tfs" role="tablist" aria-label="Vaqt oralig'i">
    <button data-tf="15m">15m</button><button data-tf="1h">1s</button><button data-tf="4h">4s</button><button data-tf="1d">1k</button>
  </div>
  <button class="icon-btn" id="notifyBtn" type="button" title="Bildirishnomalar" aria-label="Bildirishnomalar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
  </button>
</header>

<nav class="tabs" id="tabs">
  <button data-market="crypto">Kripto</button>
  <button data-market="fx">Forex va oltin</button>
  <button data-market="stocks">Aksiyalar</button>
  <button data-view="bot" class="tab-bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 17h6"/></svg>Bot</button>
</nav>

<main id="app">
  <section id="listView">
    <div class="summary" id="summary"></div>
    <div class="list" id="list"></div>
  </section>
  <section id="detailView" hidden></section>
  <section id="botView" hidden></section>
</main>

<footer class="disc">
  <b>Diqqat:</b> bu dastur matematik qoidalar asosida texnik signal ko‘rsatadi — <b>moliyaviy maslahat emas</b> va foyda kafolatlanmaydi.
  Har bir aktivning tarixiy natijasini ko‘ring: o‘tmishdagi natija kelajakni bildirmaydi. Faqat yo‘qotishga tayyor bo‘lgan pul bilan savdo qiling.
  <span class="upd" id="upd"></span>
</footer>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="js/data.js"></script>
<script src="js/signal.js"></script>
<script src="js/app.js"></script>
<script src="js/bot.js"></script>
<script src="js/bot-ui.js"></script>
</body>
</html>
